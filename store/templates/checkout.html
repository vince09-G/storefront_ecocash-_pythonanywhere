{% load static %}

{% block content %}

<div class="container mt-5">

    <h2>Checkout</h2>

    <div id="error-msg"
         class="text-danger mb-3"></div>

    <div class="mb-3">

        <label class="form-label">
            EcoCash Number
        </label>

        <input
            type="text"
            id="phone"
            class="form-control"
            placeholder="26377XXXXXXX"
            required
        >

    </div>

    <button
        id="place-order-btn"
        class="btn btn-success">

        Place Order & Pay

    </button>

</div>

<script>

let createdOrderId = null;

async function safeJson(response) {

    const text = await response.text();

    try {
        return JSON.parse(text);
    } catch (e) {
        console.error(text);
        throw new Error(
            "Server returned invalid JSON"
        );
    }
}

async function createOrder() {

    const cartId =
        localStorage.getItem("cart_id");

    if (!cartId) {
        throw new Error("Cart not found.");
    }

    const response = await fetch(
        "/api/store/orders/",
        {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json",
                "X-CSRFToken":
                    "{{ csrf_token }}"
            },
            credentials: "include",
            body: JSON.stringify({
                cart_id: cartId
            })
        }
    );

    const data =
        await safeJson(response);

    if (!response.ok) {

        throw new Error(
            data.detail ||
            data.cart_id ||
            "Order creation failed"
        );
    }

    return data.id;
}

document
.getElementById("place-order-btn")
.addEventListener("click", async () => {

    const errorMsg =
        document.getElementById(
            "error-msg"
        );

    errorMsg.innerText = "";

    try {

        const phone =
            document.getElementById(
                "phone"
            ).value.trim();

        if (!phone) {

            throw new Error(
                "Enter EcoCash number"
            );
        }

        const orderId =
            await createOrder();

        const paymentResponse =
            await fetch(
                `/store/payment/start/${orderId}/`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        "X-CSRFToken":
                            "{{ csrf_token }}"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        phone: phone
                    })
                }
            );

        const paymentData =
            await paymentResponse.json();

        if (!paymentData.success) {

            throw new Error(
                paymentData.message
            );
        }

        localStorage.removeItem(
            "cart_id"
        );

        const paymentId =
            paymentData.payment_id;

        alert(
            "Check your EcoCash phone and enter your PIN."
        );

        const interval =
            setInterval(
                async () => {

            const statusResponse =
                await fetch(
                    `/store/payment/status/${paymentId}/?phone=${phone}`
                );

            const statusData =
                await statusResponse.json();

            if (
                statusData.status ===
                "SUCCESS"
            ) {

                clearInterval(
                    interval
                );

                alert(
                    "Payment successful!"
                );

                window.location.href =
                    "/";
            }

            if (
                statusData.status ===
                "FAILED"
            ) {

                clearInterval(
                    interval
                );

                alert(
                    "Payment failed."
                );
            }

        }, 5000);

    } catch (error) {

        console.error(error);

        errorMsg.innerText =
            error.message;
    }

});

</script>

{% endblock %}
